name: Browser smoke production
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/browser-smoke-production.mjs'
      - '.github/workflows/browser-smoke-production.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke-production.mjs
